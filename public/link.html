<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>SOOP 연결 (게임용)</title>
  <script src="https://static.sooplive.com/asset/app/chat-sdk/sooplive-chat-sdk.js"></script>
  <style>body{font-family:system-ui,sans-serif;background:#0e131b;color:#edf3fa;margin:16px;font-size:13px}pre{white-space:pre-wrap;color:#9aaec4}</style>
</head>
<body>
<div id="state">SOOP 연결 중…</div>
<script>
(() => {
  // 게임 모드가 이 페이지를 숨은 Edge로 연다. 세션 키는 주소의 # 뒤에 있다 (서버 로그에 남지 않음).
  const key = new URLSearchParams(location.hash.slice(1)).get('k') || '';
  const instanceId = (crypto.randomUUID && crypto.randomUUID()) || String(Date.now()) + Math.random().toString(16).slice(2);
  const $ = (id) => document.getElementById(id);
  // 화면에는 상태 한 줄만 보여 주고, 진단 내용은 개발자 콘솔에만 남긴다.
  const log = (m) => console.log(`[SOOP 연결] ${m}`);
  const setState = (m) => { $('state').textContent = m; };

  let chat = null, state = 'idle', lastError = '', claimed = false, stopped = false, connecting = false, soopId = null;

  async function post(url, body) {
    const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const data = await r.json().catch(() => ({}));
    return { status: r.status, data };
  }

  function stop(message) {
    stopped = true; state = 'idle';
    try { chat?.disconnect(); } catch {}
    setState('SOOP 연결 종료'); log(`종료: ${message}`);
  }

  function setupChat(clientId) {
    if (chat) return;
    // Client Secret은 넘기지 않는다. 토큰 발급과 갱신은 관리자 서버가 한다.
    chat = new window.SOOP.ChatSDK(clientId);
    chat.handleError?.((code, message) => { lastError = `SDK 오류 ${code}: ${message || ''}`; log(lastError); });
    chat.handleChatClosed?.(() => { state = 'idle'; log('채팅 연결이 끊겼습니다. 다시 연결합니다.'); });
    chat.handleMessageReceived((action, message) => {
      if (action === 'JOIN') {
        const userId = String(message?.userId || '').trim();
        const nickname = String(message?.userNickname || '').trim();
        if (!userId) return;
        post('/api/link/profile', { key, instanceId, userId, nickname }).then(({ status, data }) => {
          if (status === 200) { soopId = data.soopId; log(`방송 확인: ${data.nickname || ''} (${data.soopId})`); setState('SOOP 연결됨'); }
          else { lastError = data.error || `HTTP ${status}`; log(`방송 등록 실패: ${lastError}`); if (status === 409) stop(lastError); }
        });
      }
      if (action === 'BALLOON_GIFTED') {
        const balloons = Number(message?.count);
        if (!Number.isSafeInteger(balloons) || balloons <= 0) { log(`별풍선 이벤트 형식 오류: count=${message?.count}`); return; }
        const eventId = (crypto.randomUUID && crypto.randomUUID()) || `${Date.now()}-${Math.random().toString(16).slice(2)}`;
        post('/api/link/donation', { key, instanceId, eventId, balloons, bjId: String(message?.bjId || '') }).then(({ status, data }) => {
          if (status === 200 || status === 201) log(`별풍선 ${balloons}개 전달 (${(data.rewards || []).map(r => `${r.rewardType} ${r.amount}`).join(', ') || '보상 없음'})`);
          else { lastError = data.error || `HTTP ${status}`; log(`후원 전달 실패: ${lastError}`); }
        });
      }
    });
  }

  async function connect(clientId) {
    if (connecting) return;
    connecting = true; state = 'connecting'; setState('SOOP 연결 중…');
    try {
      const { status, data } = await post('/api/link/session', { key, instanceId, claim: false, wantToken: true, state, lastError });
      if (status !== 200 || data.status !== 'ready' || !data.accessToken) { state = 'idle'; return; }
      setupChat(clientId);
      chat.setAuth(data.accessToken);
      await chat.connect();
      state = 'connected'; lastError = ''; log('SOOP 채팅 연결 완료');
    } catch (error) {
      state = 'error'; lastError = `연결 실패: ${error?.message || error}`; log(lastError);
    } finally { connecting = false; }
  }

  async function tick() {
    if (stopped) return;
    if (!key) return stop('세션 키가 없습니다.');
    if (!window.SOOP || typeof window.SOOP.ChatSDK !== 'function') { lastError = 'SOOP Chat SDK를 불러오지 못했습니다.'; log(lastError); }
    try {
      const { status, data } = await post('/api/link/session', { key, instanceId, claim: !claimed, state, lastError });
      claimed = true;
      if (status === 401 || data.status === 'invalid') return stop(data.message || '연결 정보가 없습니다.');
      if (data.status === 'stop') return stop(data.message || '연결 종료');
      if (data.status === 'waiting') { setState('SOOP 연결 대기 중…'); log(data.message || '대기 중'); if (state === 'connected') { try { chat?.disconnect(); } catch {} state = 'idle'; } }
      if (data.status === 'ready' && state !== 'connected' && window.SOOP?.ChatSDK) await connect(data.clientId);
    } catch (error) {
      lastError = `관리자 서버 연결 실패: ${error?.message || error}`; log(lastError);
    }
    setTimeout(tick, state === 'connected' ? 15000 : 4000);
  }
  tick();
})();
</script>
</body>
</html>
